name: Release

# Triggers with their parameters
on:
  workflow_dispatch:  # Manual run from Actions/Release
    inputs:
      ref:
        description: "Branch or Tag (ref)"
        required: true
        default: "master"
      new_tag:
        description: "New Tag (is created at HEAD, if branch is selected above"

# Steps to execute on triggers
jobs:
  create-release:
    runs-on: ubuntu-latest  # docker image to run on

    steps:
      - name: version = new_tag if set, otherwise fall back to ref
        id: version
        run: |
          VERSION="${{github.event.inputs.new_tag}}"
          if [ -z "$VERSION" ]; then
            VERSION="${{github.event.inputs.ref}}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # the above line creates "steps.version.outputs.version"

      - name: Checkout the repository at ref
        uses: actions/checkout@v4
        with:
          ref: ${{github.event.inputs.ref}}
          fetch-depth: 1  # last commit. Change to 0 to get all git history

      # ライブラリの zip 生成ステップは削除しました。
      # RumiCar ライブラリは Arduino 公式の Library Manager に登録され、ソースは後継リポジトリ
      # RumiCar-group/RumiCar-lib に移りました。それに伴い ArduinoAndESP32/Libraries/RumiCar/ を
      # 削除したため、ここで zip を作ることはできません (作れても古いライブラリを配ってしまいます)。
      # ライブラリのリリースは RumiCar-lib 側で行ってください。
      # 本ワークフローは教材リポジトリのタグ付け/リリース作成としてそのまま使えます。
      - name: Create Release ${{steps.version.outputs.version}}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{steps.version.outputs.version}}
          name: Release ${{steps.version.outputs.version}}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
